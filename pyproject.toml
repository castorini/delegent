[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delegent"
version = "0.1.0"
description = "Fixed-schedule model routing for cost-effective search"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Delegent contributors"}]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0"
]

train = [
  "accelerate==1.14.0",
  "huggingface-hub==1.24.0",
  "jinja2==3.1.6",
  "numpy==1.26.4",
  "peft==0.19.1",
  "protobuf==7.35.1",
  "psutil==7.2.2",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "torch==2.13.0",
  "tokenizers==0.22.2",
  "transformers==5.14.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
