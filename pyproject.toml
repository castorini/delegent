[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delegent"
version = "0.1.0"
description = "Fixed-schedule model routing for cost-effective search"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Castorini"}
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0"
]

[project.urls]
Repository = "https://github.com/castorini/Delegent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
