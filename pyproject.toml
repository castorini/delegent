[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delegent"
version = "0.2.0"
description = "A multi-agent harness built on Claude Code: the frontier model leads, a local small language model does the legwork"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Delegent contributors"}]
dependencies = ["requests>=2.31", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
delegent = "delegent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"delegent.instructions" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
